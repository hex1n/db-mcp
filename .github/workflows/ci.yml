name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -w .
      - run: git diff --exit-code
      - run: go vet ./...
      - name: Test (race detector + coverage)
        if: runner.os != 'Windows'
        run: go test -race -coverprofile=coverage.out ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...
      - run: go build ./cmd/db-mcp

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dbmcp
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pdbmcp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run MySQL and Redis live smoke tests
        env:
          DB_MCP_TEST_MYSQL: 127.0.0.1:3306/app
          DB_MCP_TEST_MYSQL_USER: root
          DB_MCP_TEST_MYSQL_PASSWORD: dbmcp
          DB_MCP_TEST_REDIS: 127.0.0.1:6379
        run: go test -run 'Test(MySQL|Redis)LiveSmoke' ./internal/engine/mysqlengine ./internal/engine/redisengine
